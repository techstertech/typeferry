services:
  mongodb:
    image: mongo:8
    command:
      - mongod
      - --replSet
      - rs0
      - --bind_ip_all
      # Keep the starter usable in small local Docker VMs. Production MongoDB
      # should retain its operator-defined disk safety threshold.
      - --setParameter
      - indexBuildMinAvailableDiskSpaceMB=50
    restart: unless-stopped
    ports:
      - '127.0.0.1:27018:27017'
    volumes:
      - mongodb-data:/data/db
    healthcheck:
      test:
        - CMD-SHELL
        - >-
          mongosh --host localhost --port 27017 --quiet --eval '
          try {
            if (rs.status().ok === 1 && db.hello().isWritablePrimary) quit(0);
            quit(1);
          } catch (error) {
            rs.initiate({_id: "rs0", members: [{_id: 0, host: "mongodb:27017"}]});
            quit(1);
          }'
      interval: 2s
      timeout: 5s
      retries: 30
      start_period: 5s

volumes:
  mongodb-data:
