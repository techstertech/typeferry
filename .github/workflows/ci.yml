name: CI

on:
  push:
    branches: [main]
    paths:
      - "typeferry-ts/**"
      - "typeferry-go/**"
      - "typeferry-py/**"
      - "typeferry-rs/**"
      - "template/**"
      - "docs/conformance/**"
      - "PROTOCOL.md"
      - ".github/workflows/ci.yml"
      - "scripts/verify-npm-package.mjs"
  pull_request:
    paths:
      - "typeferry-ts/**"
      - "typeferry-go/**"
      - "typeferry-py/**"
      - "typeferry-rs/**"
      - "template/**"
      - "docs/conformance/**"
      - "PROTOCOL.md"
      - ".github/workflows/ci.yml"
      - "scripts/verify-npm-package.mjs"

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci-go:
    name: CI (typeferry-go)
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    defaults:
      run:
        working-directory: typeferry-go
    services:
      redis:
        image: redis:7.4-alpine@sha256:c5d34a98396a4775e223c74e929162c35c5a2182901ba26b50ade939941ce14b
        ports:
          - 16379:6379
    env:
      TYPEFERRY_TEST_REDIS_URL: redis://127.0.0.1:16379
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false

      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version-file: typeferry-go/go.mod
          cache-dependency-path: typeferry-go/go.mod

      - name: Verify Go server
        run: |
          test -z "$(gofmt -l .)"
          go test ./...
          go test -race ./...
          go vet ./...

      - name: Security audit
        run: go run golang.org/x/vuln/cmd/govulncheck@v1.10.0 ./...

  ci-ts:
    name: CI (typeferry-ts)
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    defaults:
      run:
        working-directory: typeferry-ts
    env:
      NODE_OPTIONS: --max-old-space-size=4096
      REDIS_URL: redis://127.0.0.1:16379
      TYPEFERRY_MONGODB_TEST_URI: mongodb://127.0.0.1:27018/?replicaSet=typeferry-ci
      TYPEFERRY_MONGODB_TEST_DB: typeferry_mongodb_ci_test
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: 24.19.0
          cache: npm
          cache-dependency-path: typeferry-ts/package-lock.json

      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version-file: typeferry-go/go.mod
          cache-dependency-path: typeferry-go/go.mod

      - name: Pin npm
        run: npm install --global npm@11.17.0

      - name: Verify toolchain
        shell: bash
        run: |
          set -euo pipefail
          test "$(node --version)" = "v24.19.0"
          test "$(npm --version)" = "11.17.0"

      - run: npm ci
        timeout-minutes: 10

      - name: Security audit
        run: npm audit --audit-level=low

      - name: Lint
        run: npm run lint

      - name: TypeScript
        run: npm run typecheck

      - name: Unit tests
        # The host runner has returned status 1 after a fully passing parallel
        # Vitest summary; serial files remove that worker-shutdown race while
        # retaining Vitest's complete assertion contract.
        run: npm run test:unit -- --no-file-parallelism
        timeout-minutes: 10

      - name: Start integration services
        env:
          MONGO_CONTAINER: typeferry-mongodb-ci
          REDIS_CONTAINER: typeferry-redis-ci
        shell: bash
        run: |
          set -euo pipefail
          docker rm --force "$MONGO_CONTAINER" "$REDIS_CONTAINER" >/dev/null 2>&1 || true
          docker run --detach --rm \
            --name "$MONGO_CONTAINER" \
            --publish 127.0.0.1:27018:27018 \
            mongo:7.0@sha256:8bb4442761a63a8dda452744082cdac9644b429807eb977b42324a63cef59ca4 \
            mongod --bind_ip_all --port 27018 --replSet typeferry-ci
          docker run --detach --rm \
            --name "$REDIS_CONTAINER" \
            --publish 127.0.0.1:16379:6379 \
            redis:7.4-alpine@sha256:c5d34a98396a4775e223c74e929162c35c5a2182901ba26b50ade939941ce14b
          for attempt in $(seq 1 60); do
            if docker exec "$MONGO_CONTAINER" mongosh --quiet --port 27018 --eval \
              'db.adminCommand({ping:1})' >/dev/null; then
              break
            fi
            sleep 1
          done
          docker exec "$MONGO_CONTAINER" mongosh --quiet --port 27018 --eval \
            'rs.initiate({_id:"typeferry-ci",members:[{_id:0,host:"127.0.0.1:27018"}]})'
          for attempt in $(seq 1 60); do
            if docker exec "$MONGO_CONTAINER" mongosh --quiet --port 27018 --eval \
              'if (!db.hello().isWritablePrimary) quit(1)' >/dev/null; then
              break
            fi
            sleep 1
          done
          docker exec "$MONGO_CONTAINER" mongosh --quiet --port 27018 --eval \
            'if (!db.hello().isWritablePrimary) quit(1)' >/dev/null
          for attempt in $(seq 1 30); do
            if docker exec "$REDIS_CONTAINER" redis-cli ping | grep -q PONG; then
              exit 0
            fi
            sleep 1
          done
          docker logs "$MONGO_CONTAINER"
          docker logs "$REDIS_CONTAINER"
          exit 1
        timeout-minutes: 5

      - name: Integration tests
        run: npm run test:integration
        timeout-minutes: 10

      - name: Stop integration services
        if: always()
        env:
          MONGO_CONTAINER: typeferry-mongodb-ci
          REDIS_CONTAINER: typeferry-redis-ci
        run: docker stop "$MONGO_CONTAINER" "$REDIS_CONTAINER" || true

      - uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5
        id: playwright-cache
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('typeferry-ts/package-lock.json') }}
          restore-keys: |
            playwright-${{ runner.os }}-

      - run: npm exec -- playwright install --with-deps
        timeout-minutes: 10
        if: steps.playwright-cache.outputs.cache-hit != 'true'

      - run: npm exec -- playwright install-deps
        timeout-minutes: 10
        if: steps.playwright-cache.outputs.cache-hit == 'true'

      - name: Browser tests
        run: npm run test:browser
        timeout-minutes: 10
        env:
          CI: true

      - name: Build
        run: npm run build

      - name: Verify npm package
        run: node ../scripts/verify-npm-package.mjs

  ci-py:
    name: CI (typeferry-py)
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    defaults:
      run:
        working-directory: typeferry-py
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false

      - name: Install Python dependencies
        run: |
          python3 -m venv .venv
          .venv/bin/pip install --upgrade pip
          .venv/bin/pip install -e ".[all,dev]"

      - name: Security audit
        run: |
          python3 -m venv .audit-venv
          .audit-venv/bin/pip install --quiet pip-audit
          .audit-venv/bin/pip-audit --skip-editable --path "$(.venv/bin/python -c 'import sysconfig; print(sysconfig.get_path("purelib"))')"

      - name: Lint Python
        run: .venv/bin/python -m ruff check .

      - name: Typecheck Python
        run: .venv/bin/python -m mypy

      - name: Test Python
        run: .venv/bin/python -m pytest

  ci-rs:
    name: CI (typeferry-rs)
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    defaults:
      run:
        working-directory: typeferry-rs
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false

      - name: Install Rust toolchain
        run: |
          rustup toolchain install stable --component rustfmt --component clippy
          rustup default stable

      - name: Install cargo-deny
        uses: taiki-e/install-action@073e1fd0bc889c9aee68dbaaa927cde1b5653a83 # v2.90.11
        with:
          tool: cargo-deny

      - name: Security audit
        run: cargo deny check advisories

      - name: Verify Rust server
        run: |
          cargo fmt --all -- --check
          cargo clippy --workspace --all-targets --all-features -- -D warnings
          cargo test --workspace --all-features

  ci-template:
    name: CI (template)
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    defaults:
      run:
        working-directory: template
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: 26.5.1
          cache: npm
          cache-dependency-path: template/package-lock.json

      - name: Pin npm
        run: npm install --global npm@11.17.0

      - run: npm ci
        timeout-minutes: 10

      - name: Security audit
        run: npm audit --audit-level=low

      - name: Verify template
        run: |
          npm run typecheck
          npm run lint
          npm run format:check
          npm run test:unit
